<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Arial, sans-serif">

  <!-- AVANT (haut) -->
  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">AVANT du véhicule</text>
  <text x="280" y="40" text-anchor="middle" font-size="12" fill="#1a5276">180° — secteur 12</text>
  <line x1="280" y1="145" x2="280" y2="73" stroke="#1a5276" stroke-width="2.5"/>
  <polygon points="280,58 273,73 287,73" fill="#1a5276"/>

  <!-- Cercle LiDAR (centre) -->
  <circle cx="280" cy="200" r="55" fill="#eaf4fb" stroke="#1a5276" stroke-width="2"/>
  <text x="280" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">LiDAR</text>
  <text x="280" y="215" text-anchor="middle" font-size="11" fill="#666">câble → arrière</text>

  <!-- ARRIÈRE (bas) -->
  <line x1="280" y1="255" x2="280" y2="337" stroke="#922b21" stroke-width="2.5"/>
  <polygon points="280,352 273,337 287,337" fill="#922b21"/>
  <text x="280" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#922b21">ARRIÈRE du véhicule</text>
  <text x="280" y="387" text-anchor="middle" font-size="12" fill="#922b21">0° — secteur 0</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#922b21">(câble ici)</text>

  <!-- GAUCHE (gauche) -->
  <line x1="225" y1="200" x2="141" y2="200" stroke="#2e7d32" stroke-width="2.5"/>
  <polygon points="126,200 141,193 141,207" fill="#2e7d32"/>
  <text x="80" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">GAUCHE</text>
  <text x="80" y="204" text-anchor="middle" font-size="12" fill="#2e7d32">90° — sect. 6</text>

  <!-- DROITE (droite) -->
  <line x1="335" y1="200" x2="419" y2="200" stroke="#2e7d32" stroke-width="2.5"/>
  <polygon points="434,200 419,193 419,207" fill="#2e7d32"/>
  <text x="480" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">DROITE</text>
  <text x="480" y="204" text-anchor="middle" font-size="12" fill="#2e7d32">270° — sect. 19</text>

</svg>
